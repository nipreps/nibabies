on:
  pull_request_target

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  check-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Find submitting repository
        id: get-source-repo
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          PULL: ${{ github.event.number }}
        with:
          script: |
            const { data } = await github.rest.pulls.get({
              owner: process.env.OWNER,
              repo: process.env.REPO.split('/')[1],
              pull_number: process.env.PULL,
            });
            core.setOutput('remote', data.head.repo.html_url)
            core.setOutput('branch', data.head.ref)
      - name: Set git identity
        run: |
          git config --global user.name "nipreps[bot]"
          git config --global user.email "bot@nipreps.org"
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: v0.70.0
          run-install: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Update lockfile
        # Since preps are sometimes set to branch refs, explicitly call update for them
        run: >
          uvx datalad run -i pixi.lock -i pyproject.toml -o pixi.lock --
          bash -c 'set -e; pixi lock; pixi update nireports niworkflows sdcflows smriprep;
          git diff --quiet -- pixi.lock || exit 0; git checkout -- pixi.lock'
      - name: Push updated lockfile, if needed
        run: |
          git push $REMOTE HEAD:$BRANCH
        env:
          REMOTE: ${{ steps.get-source-repo.outputs.remote }}
          BRANCH: ${{ steps.get-source-repo.outputs.branch }}
